name: SBOM & Security Compliance Pipeline

on:
  pull_request:
    branches: [ main, master ]

jobs:
  # KR: Evitar que los secretos se almacenen en repositorio (CIA)
  secrets-detection:
    name: Gitleaks Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-sbom:
    name: Build & Artifact Versioning
    needs: secrets-detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- SETUP JAVA ---
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # KR: Generación de Binarios y SBOM para Java
      - name: Build & Generate Java SBOM
        run: |
          cd authorization-server && ./mvnw clean package cyclonedx:makeAggregateBom -DskipTests
          cd ../resource-server && ./mvnw clean package cyclonedx:makeAggregateBom -DskipTests

      # --- SETUP NODE ---
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      # KR: Generación de SBOM para Angular
      - name: Generate Angular SBOM
        run: |
          cd ag-prueba-front
          npm install
          npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      # KR: Los binarios se almacenan y se versionan (Artifacts)
      - name: Version and Store Binaries
        uses: actions/upload-artifact@v4
        with:
          name: production-binaries-${{ github.sha }}
          path: |
            authorization-server/target/*.jar
            resource-server/target/*.jar
          retention-days: 90

      # KR: Se controla el SBOM y se versiona
      - name: Store SBOM Reports
        uses: actions/upload-artifact@v4
        with:
          name: sbom-manifests-${{ github.sha }}
          path: |
            **/target/bom.json
            ag-prueba-front/sbom.json

  # KR: Se realiza al menos un escaneo tras el despliegue (Container Scanning)
  container-vulnerability-scan:
    name: Post-Build Container Scan
    needs: build-and-sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images for Scan
        run: |
          docker build -t auth-server:latest ./authorization-server
          docker build -t resource-server:latest ./resource-server

      - name: Trivy Scan (Authorization Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'auth-server:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Trivy Scan (Resource Server)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'resource-server:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'